name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_binary_build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            build_name: pfsense_exporter-linux-amd64
          - goos: linux
            goarch: arm64
            build_name: pfsense_exporter-linux-arm64
          - goos: windows
            goarch: amd64
            build_name: pfsense_exporter-windows-amd64.exe
          - goos: windows
            goarch: arm64
            build_name: pfsense_exporter-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            build_name: pfsense_exporter-darwin-amd64
          - goos: darwin
            goarch: arm64
            build_name: pfsense_exporter-darwin-arm64
          - goos: freebsd
            goarch: amd64
            build_name: pfsense_exporter-freebsd-amd64
          - goos: freebsd
            goarch: arm64
            build_name: pfsense_exporter-freebsd-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Build exporter
        env:
            GOOS: ${{ matrix.goos }}
            GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X 'main.version=${{ github.ref_name }}'" -o ${{ matrix.build_name }} ./cmd/pfsense_exporter

      - name: Upload build as release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.build_name }}

  release_image_build:
    runs-on: ubuntu-latest

    # Ensure we have permissions to write to the package repo
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Push image build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_IMAGE_VERSION=${{ github.ref_name }}

  release_helm_chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Format version for Helm
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: helm package charts/pfsense-exporter --version ${{ steps.get_version.outputs.VERSION }} --app-version ${{ github.ref_name }}
          
      - name: Upload Helm chart as release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: pfsense-exporter-${{ steps.get_version.outputs.VERSION }}.tgz

      - name: Re-index Helm chart repository
        run: |
          # Ensure we fail fast
          set -e  

          # Set up git config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the new chart for now so we can switch branches and update the index
          git stash push -u -m "release_helm_chart" pfsense-exporter-${{ steps.get_version.outputs.VERSION }}.tgz
          git fetch origin gh-pages
          git checkout gh-pages
          git stash pop

          # Update Helm repo index and remove the chart file
          helm repo index . --merge index.yaml --url https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/

          # Commit and push the updated index
          git add index.yaml
          git commit -m "chore(helm): add pfsense-exporter-${{ steps.get_version.outputs.VERSION }} to repo index"
          git push origin gh-pages
        
